# Example production overrides. The local course path does not require these resources.
application:
  environment: azure
agent:
  provider: azure_openai
  azure_openai_endpoint: ${AZURE_OPENAI_ENDPOINT}
  azure_openai_api_key: ${AZURE_OPENAI_API_KEY}
  azure_openai_deployment: ${AZURE_OPENAI_DEPLOYMENT}
  azure_openai_api_version: ${AZURE_OPENAI_API_VERSION}
  azure_openai_timeout_seconds: 120
storage:
  database_url: ${AZURE_SQL_CONNECTION_STRING}
  blob_container: ${AZURE_STORAGE_CONTAINER}
retrieval:
  backend: chroma
  embedding_provider: azure_openai
observability:
  application_insights_connection_string: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
