[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-retention-agent"
version = "0.1.0"
description = "Local-first enterprise AI agent course project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "langchain>=0.3,<0.4",
  "langchain-ollama>=0.3,<0.4",
  "langgraph>=0.3,<0.5",
  "xgboost>=2.1,<3",
  "chromadb>=0.5,<0.7",
  "agent-framework-core==1.11.0",
  "agent-framework-ollama==1.0.0b260709",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
ui = ["streamlit>=1.40,<2"]
observability = [
  "mlflow>=3.6,<4",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]
all = [
  "streamlit>=1.40,<2",
  "mlflow>=3.6,<4",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "pipelines*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "slow: end-to-end or external-provider test; excluded from the fast local test run",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts", "data", ".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
